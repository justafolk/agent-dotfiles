# ~/.tmux.conf
# Codex/dev workspace defaults.

##### Prefix and terminal behavior
unbind C-b
unbind C-a
set-option -g prefix C-w
bind-key C-w send-prefix

set-option -g default-terminal "screen-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"
set-option -g mouse on
set-option -g history-limit 50000
set-option -g renumber-windows on
set-option -g base-index 1
set-window-option -g pane-base-index 1
setw -g mode-keys vi

##### Pane/window bindings
# ss: horizontal/top-bottom split. sv: vertical/left-right split. te: new tmux window.
bind-key s split-window -v -c "#{pane_current_path}"
bind-key v split-window -h -c "#{pane_current_path}"
bind-key e new-window -c "#{pane_current_path}"
bind-key Space select-pane -t :.+
bind-key l select-pane -t :.+
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U

# Explicit mnemonic variants after the prefix, useful outside Bash vi mode.
bind-key S split-window -v -c "#{pane_current_path}"
bind-key V split-window -h -c "#{pane_current_path}"
bind-key T new-window -c "#{pane_current_path}"
bind-key L select-pane -t :.+

##### Codex workspace integration
# One window, three panes:
#   left: full-height main/Codex pane
#   right top: shell pane
#   right bottom: Vim pane
set-option -g @codex_auto_layout "on"
set-option -g @codex_auto_vim "on"
set-option -g @codex_auto_watch "on"
set-option -g @codex_auto_start "off"
set-option -g @codex_watch_interval "2"
set-option -g @codex_watch_max_depth "6"
set-option -g @codex_watch_root ""

bind-key D run-shell -b "$HOME/.local/bin/tmux-codex-layout #{session_name} #{session_name}:#{window_index}"
bind-key O run-shell -b "$HOME/.local/bin/tmux-codex-open-edits #{session_name}:#{window_index} once"
bind-key C send-keys -t "#{@codex_main_pane}" "codex" C-m
bind-key Q run-shell -b "$HOME/.local/bin/tmux-opencode-popup #{session_name} '#{pane_current_path}'"
bind-key P run-shell -b "$HOME/.local/bin/tmux-ai-prs-popup '#{pane_current_path}'"

set-hook -g session-created 'if -F "#{==:#{@codex_auto_layout},on}" "run-shell -b \"$HOME/.local/bin/tmux-codex-layout #{session_name}\""'
